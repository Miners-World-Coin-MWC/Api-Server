name: Deploy Web Wallet

on:
  push:
    branches: ["main"]
    paths:
      - "web-wallet/**"
      - "src/mwc.ts"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wallet dependencies
        working-directory: web-wallet
        run: npm install

      - name: Build
        working-directory: web-wallet
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-wallet/dist

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
