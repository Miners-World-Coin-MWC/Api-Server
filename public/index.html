<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MWC Wallet API</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; background:#0b0e11; color:#eee; }
    code, pre { background:#151a1f; padding:12px; border-radius:8px; overflow:auto; }
    h1 { color:#ffd966; }
    .ok { color:#7ee787; }
    button { padding:10px 14px; cursor:pointer; }
  </style>
</head>
<body>
  <h1>Miners World Coin — Wallet API</h1>
  <p>Non-custodial, database-free, GitHub-hosted wallet SDK.</p>
  <button id="check">Check MWC API</button>
  <pre id="output">Ready.</pre>

  <script type="module">
    const output = document.querySelector("#output");
    document.querySelector("#check").addEventListener("click", async () => {
      output.textContent = "Checking...";
      try {
        const response = await fetch("https://api.minersworld.org/info");
        const json = await response.json();
        output.textContent = JSON.stringify(json, null, 2);
      } catch (error) {
        output.textContent = String(error);
      }
    });
  </script>
</body>
</html>
